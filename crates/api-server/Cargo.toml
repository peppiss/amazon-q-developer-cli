[package]
name = "amazon-q-developer-api"
version = "0.1.0"
edition = "2021"
description = "REST API server for Amazon Q Developer CLI"
authors = ["Amazon Q Developer Team"]

[dependencies]
# API server dependencies
actix-web = "4.4.0"
actix-cors = "0.6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.28", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
thiserror = "1.0"
eyre = "0.6"
dotenv = "0.15"
uuid = { version = "1.4", features = ["v4", "serde"] }
async-stream = "0.3"
bytes = "1.4"
env_logger = "0.10"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }

# Internal crate dependencies
cli = { path = "../cli" }

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }
